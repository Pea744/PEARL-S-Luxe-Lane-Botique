<main>
    <h2>Make an Enquiry</h2>

    <form>
        <p>
            <label for="name">
                Full Name:
            </label>
            <br>

            <input type="text"
             id="name" 
             name="name"
              placeholder="Enter your full name">
        </p>

        <p>
            <label for="email">
                Email Address:
            </label>
            <br>

            <input type="email" 
            id="email"
             name="email"
              placeholder="Enter your email address">
        </p>

        <p>
            <label for="product">
                Product:
            </label>

            <br>

            <input type="text"
             id="product" 
             name="product"
              placeholder="Enter the product you are interested in">
        </p>

        <p>
            <label for="message">
                Message:
            </label>

            <br>
            <textarea id="message"
             name="message"
             placeholder="Enter your enquiry">
            </textarea>
        </p>

        <button type="submit">
            Submit Enquiry
        </button>
    </form>
</main>
